<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Last Dance — Напоить</title>
<style>
:root{--bg:#08080d;--panel:rgba(18,18,29,.78);--text:#fff;--muted:#a9a9ba;--glow:#ff8a2b;--pink:#d64cff;--cyan:#56e7ff}
*{box-sizing:border-box} html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
body{background:
 radial-gradient(circle at 50% 45%,rgba(214,76,255,.13),transparent 33%),
 radial-gradient(circle at 25% 15%,rgba(255,138,43,.10),transparent 30%),
 radial-gradient(circle at 80% 78%,rgba(86,231,255,.08),transparent 28%),
 linear-gradient(160deg,#07070b,#0d0912 55%,#07090d)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;background-image:radial-gradient(circle,rgba(255,255,255,.55) 0 1px,transparent 1.3px);background-size:42px 42px;mask-image:linear-gradient(to bottom,transparent,black 20%,black 80%,transparent)}
.game{position:relative;width:100vw;height:100dvh;min-height:560px;isolation:isolate}
.brand{position:absolute;left:50%;top:16px;transform:translateX(-50%);font-weight:900;letter-spacing:.25em;font-size:clamp(12px,1.35vw,18px);opacity:.85;text-transform:uppercase;white-space:nowrap}
.brand b{color:#ffb266;text-shadow:0 0 18px rgba(255,138,43,.7)}
.arena{position:absolute;inset:52px 16px 20px}
.player{position:absolute;width:clamp(92px,10vw,138px);height:clamp(112px,12.2vw,164px);transform:translate(-50%,-50%);transition:left .35s ease,top .35s ease;z-index:3}
.player-card{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:flex-start;flex-direction:column;gap:4px;filter:drop-shadow(0 8px 24px rgba(0,0,0,.45))}
.avatar-wrap{position:relative;width:min(100%,128px);aspect-ratio:1/1;border-radius:50%;padding:3px;background:linear-gradient(135deg,rgba(255,138,43,.95),rgba(214,76,255,.9),rgba(86,231,255,.9));box-shadow:0 0 0 1px rgba(255,255,255,.12),0 0 24px rgba(214,76,255,.15)}
.avatar{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;transition:filter .45s ease,transform .45s ease,box-shadow .45s ease;will-change:filter,transform}
.name{max-width:100%;font-weight:800;font-size:clamp(10px,1vw,13px);line-height:1.05;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 7px #000}
.lives{font-size:clamp(10px,.9vw,12px);font-weight:750;color:#f7d9c1;background:rgba(0,0,0,.48);border:1px solid rgba(255,255,255,.09);padding:3px 7px;border-radius:999px;backdrop-filter:blur(4px)}
.cups{letter-spacing:1px;font-size:9px;line-height:1;opacity:.8;white-space:nowrap}
.player.hit .avatar-wrap{animation:hitPulse .68s cubic-bezier(.2,.9,.2,1)}
.player.winner .avatar-wrap{animation:winnerBounce .7s ease-in-out infinite alternate;box-shadow:0 0 16px rgba(255,178,102,.95),0 0 45px rgba(214,76,255,.65)}
.player[data-lives="4"] .avatar{filter:saturate(1.12) sepia(.08) hue-rotate(-4deg)}
.player[data-lives="3"] .avatar{filter:saturate(1.35) contrast(1.06) sepia(.18) hue-rotate(-12deg)}
.player[data-lives="2"] .avatar{filter:saturate(1.65) contrast(1.08) hue-rotate(-24deg) blur(.35px);transform:rotate(-1.2deg) scale(1.015)}
.player[data-lives="1"] .avatar{filter:saturate(2) contrast(1.14) hue-rotate(-38deg) blur(.8px);transform:rotate(2.2deg) scale(1.03)}
.player[data-lives="0"] .avatar{filter:saturate(2.5) contrast(1.18) hue-rotate(-55deg) blur(1.2px);transform:rotate(-3deg) scale(1.045)}
@keyframes hitPulse{0%{transform:scale(1)}25%{transform:scale(1.16) rotate(-4deg)}50%{transform:scale(.94) rotate(4deg)}75%{transform:scale(1.08) rotate(-2deg)}100%{transform:scale(1)}}
@keyframes winnerBounce{to{transform:translateY(-8px) rotate(3deg) scale(1.08)}}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:clamp(190px,22vw,300px);aspect-ratio:1;display:grid;place-items:center;z-index:4}
.disc{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 42% 35%,rgba(255,255,255,.09),rgba(20,15,28,.96) 50%,rgba(8,8,13,.98));border:1px solid rgba(255,255,255,.13);box-shadow:0 0 0 8px rgba(255,255,255,.018),0 0 44px rgba(214,76,255,.18),inset 0 0 32px rgba(0,0,0,.8)}
.disc:before{content:"";position:absolute;inset:10px;border-radius:50%;border:1px dashed rgba(255,178,102,.26);animation:slowSpin 24s linear infinite}
@keyframes slowSpin{to{transform:rotate(360deg)}}
.arrow{position:absolute;left:50%;top:50%;width:42%;height:12px;transform-origin:0 50%;transform:rotate(0deg);transition:transform 3.4s cubic-bezier(.12,.72,.16,1);z-index:4;will-change:transform}
.arrow .shaft{position:absolute;left:0;top:50%;width:82%;height:7px;transform:translateY(-50%);border-radius:999px;background:linear-gradient(90deg,#fff2db,#ff9e44 50%,#ff5d8f);box-shadow:0 0 18px rgba(255,138,43,.85)}
.arrow .head{position:absolute;right:0;top:50%;transform:translateY(-50%);width:0;height:0;border-top:13px solid transparent;border-bottom:13px solid transparent;border-left:23px solid #ff6c7e;filter:drop-shadow(0 0 8px rgba(255,92,126,.75))}
.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:25px;height:25px;border-radius:50%;background:#fff4e5;border:5px solid #ff8a2b;box-shadow:0 0 18px rgba(255,138,43,.9);z-index:6}
.controls{position:relative;z-index:8;display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:51%}
.drink-btn,.restart-btn{appearance:none;border:0;border-radius:999px;cursor:pointer;font-weight:900;letter-spacing:.02em;color:#0b0710;background:linear-gradient(135deg,#ffbd78,#ff7f38 48%,#ff5e91);box-shadow:0 10px 30px rgba(255,105,65,.28),inset 0 1px rgba(255,255,255,.4);padding:12px 23px;font-size:clamp(14px,1.3vw,18px);transition:transform .15s ease,filter .15s ease;white-space:nowrap}
.drink-btn:hover{transform:translateY(-2px) scale(1.03);filter:brightness(1.08)} .drink-btn:active{transform:translateY(1px) scale(.98)} .drink-btn:disabled{cursor:not-allowed;filter:grayscale(.3) brightness(.72);transform:none}
.hint{font-size:10px;color:var(--muted);opacity:.72;letter-spacing:.05em}
.flying-drink{position:absolute;z-index:30;left:50%;top:50%;transform:translate(-50%,-50%);font-size:38px;pointer-events:none;filter:drop-shadow(0 5px 8px rgba(0,0,0,.45));animation:flyDrink .78s cubic-bezier(.18,.72,.25,1) forwards}
@keyframes flyDrink{0%{transform:translate(-50%,-50%) scale(.45) rotate(0);opacity:0}15%{opacity:1}70%{transform:translate(calc(-50% + var(--dx)*.76),calc(-50% + var(--dy)*.76)) scale(1.3) rotate(330deg);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.75) rotate(540deg);opacity:0}}
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(4,4,8,.72);backdrop-filter:blur(8px);z-index:100;opacity:0;pointer-events:none;transition:opacity .3s ease}.overlay.show{opacity:1;pointer-events:auto}
.modal{width:min(92vw,520px);text-align:center;padding:32px 24px 26px;border-radius:28px;background:linear-gradient(180deg,rgba(35,24,45,.96),rgba(14,12,20,.97));border:1px solid rgba(255,255,255,.14);box-shadow:0 26px 100px rgba(0,0,0,.55),0 0 50px rgba(214,76,255,.18);transform:scale(.88);transition:transform .32s cubic-bezier(.2,.9,.25,1.2)}.overlay.show .modal{transform:scale(1)}
.trophy{font-size:62px;animation:trophy 1s ease-in-out infinite alternate}@keyframes trophy{to{transform:rotate(8deg) scale(1.1)}}
.result{font-size:clamp(25px,4vw,42px);font-weight:950;line-height:1.02;margin:8px 0 10px}.sub{color:#c4bacd;margin-bottom:20px}.restart-btn{font-size:15px;padding:12px 20px}
.confetti{position:fixed;left:0;top:0;width:10px;height:16px;border-radius:3px;z-index:120;pointer-events:none;animation:confettiFall 1.9s ease-in forwards}@keyframes confettiFall{to{transform:translate(var(--x),110vh) rotate(var(--r));opacity:.15}}
@media(max-width:760px){
 .arena{inset:42px 4px 4px}.brand{top:10px}.center{width:clamp(152px,34vw,210px)}
 .player{width:clamp(70px,18vw,96px);height:clamp(91px,22vw,124px)}
 .avatar-wrap{width:min(100%,90px)} .name{font-size:9px}.lives{font-size:9px;padding:2px 5px}.cups{display:none}
 .drink-btn{padding:10px 17px;font-size:13px}.hint{display:none}
}
@media(max-height:650px) and (min-width:761px){.arena{inset:38px 12px 8px}.player{width:92px;height:118px}.avatar-wrap{width:90px}.center{width:176px}.drink-btn{padding:9px 17px;font-size:14px}.brand{top:9px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<main class="game" id="game">
  <div class="brand">G10 · <b>LAST DANCE</b> · 22–23</div>
  <section class="arena" id="arena" aria-label="Игровое поле">
    <div class="center">
      <div class="disc"></div>
      <div class="arrow" id="arrow"><div class="shaft"></div><div class="head"></div></div>
      <div class="hub"></div>
      <div class="controls">
        <button class="drink-btn" id="drinkBtn">🍺 Напоить</button>
        <div class="hint">каждый спин — случайный</div>
      </div>
    </div>
  </section>
</main>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="resultText">
  <div class="modal">
    <div class="trophy">🍻</div>
    <div class="result" id="resultText"></div>
    <div class="sub">Первый герой Last Dance официально готов.</div>
    <button class="restart-btn" id="restartBtn">Играть ещё раз</button>
  </div>
</div>

const MAX_LIVES = 5;
const arena=document.getElementById('arena'), arrow=document.getElementById('arrow'), drinkBtn=document.getElementById('drinkBtn');
const overlay=document.getElementById('overlay'), resultText=document.getElementById('resultText'), restartBtn=document.getElementById('restartBtn');
const drinks=['🍺','🍹','🥃','🍸','🍷','🥂'];
let players=[], currentRotation=0, spinning=false, gameOver=false;

function cryptoRandomInt(max){
  // Rejection sampling avoids modulo bias; no balancing/history is used.
  const range=0x100000000, limit=range-(range%max), a=new Uint32Array(1);
  do{crypto.getRandomValues(a)}while(a[0]>=limit);
  return a[0]%max;
}
function renderPlayers(){
  players=NAMES.map((name,i)=>({name,lives:MAX_LIVES,el:null}));
  arena.querySelectorAll('.player').forEach(x=>x.remove());
  players.forEach((p,i)=>{
    const el=document.createElement('div'); el.className='player'; el.dataset.lives=MAX_LIVES;
    el.innerHTML=`<div class="player-card"><div class="avatar-wrap"><img class="avatar" src="${AVATARS[i]}" alt="${p.name}"></div><div class="name">${p.name}</div><div class="lives">5/5</div><div class="cups">🍺🍺🍺🍺🍺</div></div>`;
    arena.appendChild(el); p.el=el;
  });
  layoutPlayers();
}
function layoutPlayers(){
  if(!players.length)return;
  const r=arena.getBoundingClientRect(), n=players.length;
  const mobile=window.innerWidth<760;
  const playerW=players[0].el.getBoundingClientRect().width||90;
  const rx=Math.max(120, r.width/2-playerW*.65-8);
  const ry=Math.max(155, r.height/2-(mobile?74:82));
  players.forEach((p,i)=>{
    const a=(-90+i*360/n)*Math.PI/180;
    p.el.style.left=`${r.width/2+Math.cos(a)*rx}px`;
    p.el.style.top=`${r.height/2+Math.sin(a)*ry}px`;
  });
}
function updatePlayer(p){
  p.el.dataset.lives=p.lives;
  p.el.querySelector('.lives').textContent=`${p.lives}/${MAX_LIVES}`;
  p.el.querySelector('.cups').textContent='🍺'.repeat(p.lives)+'·'.repeat(MAX_LIVES-p.lives);
}
function playerAngle(i){return -90+i*(360/players.length)}
async function spin(){
  if(spinning||gameOver)return; spinning=true; drinkBtn.disabled=true;
  const winnerIndex=cryptoRandomInt(players.length);
  const extraTurns=5+cryptoRandomInt(4); // only animation length; selection above is already random
  const target=playerAngle(winnerIndex);
  const normalized=((currentRotation%360)+360)%360;
  const delta=((target-normalized)+360)%360;
  currentRotation += extraTurns*360+delta;
  arrow.style.transform=`rotate(${currentRotation}deg)`;
  await wait(3450);
  hitPlayer(winnerIndex);
  await wait(880);
  if(!gameOver){drinkBtn.disabled=false;spinning=false}
}
function hitPlayer(index){
  const p=players[index];
  flyDrink(p.el);
  p.el.classList.remove('hit'); void p.el.offsetWidth; p.el.classList.add('hit');
  p.lives=Math.max(0,p.lives-1); updatePlayer(p);
  setTimeout(()=>p.el.classList.remove('hit'),760);
  if(p.lives===0){gameOver=true; p.el.classList.add('winner'); setTimeout(()=>showWinner(p),700)}
}
function flyDrink(target){
  const a=arena.getBoundingClientRect(), t=target.getBoundingClientRect();
  const startX=a.left+a.width/2,startY=a.top+a.height/2;
  const targetX=t.left+t.width/2,targetY=t.top+t.height/2;
  const d=document.createElement('div'); d.className='flying-drink'; d.textContent=drinks[cryptoRandomInt(drinks.length)];
  d.style.left=`${startX}px`;d.style.top=`${startY}px`;d.style.setProperty('--dx',`${targetX-startX}px`);d.style.setProperty('--dy',`${targetY-startY}px`);
  document.body.appendChild(d);setTimeout(()=>d.remove(),900);
}
function showWinner(p){
  resultText.textContent=`${p.name} напился первым 🍺`;
  overlay.classList.add('show'); confetti();
}
function confetti(){
  for(let i=0;i<72;i++){
    const c=document.createElement('i');c.className='confetti';
    c.style.left=`${cryptoRandomInt(100)}vw`;c.style.top=`-${10+cryptoRandomInt(80)}px`;
    c.style.background=`hsl(${cryptoRandomInt(360)} 90% 65%)`;
    c.style.setProperty('--x',`${-120+cryptoRandomInt(240)}px`);c.style.setProperty('--r',`${360+cryptoRandomInt(1080)}deg`);
    c.style.animationDelay=`${cryptoRandomInt(600)}ms`;document.body.appendChild(c);setTimeout(()=>c.remove(),2800);
  }
}
function restart(){
  overlay.classList.remove('show');gameOver=false;spinning=false;drinkBtn.disabled=false;
  players.forEach(p=>{p.lives=MAX_LIVES;p.el.classList.remove('winner','hit');updatePlayer(p)});
  currentRotation=0;arrow.style.transition='none';arrow.style.transform='rotate(0deg)';void arrow.offsetWidth;arrow.style.transition='transform 3.4s cubic-bezier(.12,.72,.16,1)';
}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
drinkBtn.addEventListener('click',spin); restartBtn.addEventListener('click',restart); window.addEventListener('resize',layoutPlayers,{passive:true});
renderPlayers();
</script>
</body></html>
